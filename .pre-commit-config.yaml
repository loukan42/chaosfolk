# Local gate before every commit: `pre-commit install` once, then hooks run automatically.
# CI runs the same tools (ruff, bandit, gitleaks) so a skipped hook is still caught.
# Refresh pinned versions with `pre-commit autoupdate` and review the diff like any dependency update.
minimum_pre_commit_version: "4.0.0"
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=2048"]
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
        exclude: ^assets/
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff
  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args: ["-c", "pyproject.toml", "-ll", "-q"]
        additional_dependencies: ["bandit[toml]"]
        files: ^src/
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
