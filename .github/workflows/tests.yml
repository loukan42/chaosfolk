name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade "pip>=26.2,<27"
      - run: python -m pip install -e ".[dev,visual,pdf,chaos]" "pip-audit>=2,<3"
      - run: python -m pip_audit --skip-editable

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.14']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m playwright install --with-deps chromium
      - run: python -m ruff check .
      - run: python -m pytest -q
      - run: python -m build
      - name: Install and inspect built wheel
        shell: python
        run: |
          import glob, os, pathlib, subprocess, sys, tempfile, venv
          wheel = pathlib.Path(glob.glob('dist/*.whl')[0]).resolve()
          with tempfile.TemporaryDirectory() as directory:
              root = pathlib.Path(directory)
              venv.create(root / 'env', with_pip=True)
              python = root / 'env' / ('Scripts/python.exe' if os.name == 'nt' else 'bin/python')
              subprocess.run([str(python), '-m', 'pip', 'install', str(wheel)], check=True)
              subprocess.run([str(python), '-m', 'chaosfolk', '--version'], cwd=root, check=True)
              subprocess.run([str(python), '-m', 'chaosfolk', 'check'], cwd=root, check=True)
              subprocess.run([str(python), '-m', 'chaosfolk', 'setup', '--skip-browser', '--agent', 'claude-code', '--home', str(root / 'home')], cwd=root, check=True)
              assert (root / 'home' / '.claude' / 'skills' / 'chaosfolk' / 'docs' / 'workflow.md').is_file()
              subprocess.run([str(python), '-m', 'chaosfolk', 'draw', '--count', '1', '--seed', '42', '--objectives', 'Create a project', '--folder', str(root / 'session')], cwd=root, check=True)
              subprocess.run([str(python), '-m', 'chaosfolk', 'sheets', '--folder', str(root / 'session'), '--data', 'Synthetic names', '--forbidden', 'External actions'], cwd=root, check=True)
              assets = "from importlib.resources import files; root = files('chaosfolk'); assert all(root.joinpath('templates', name).read_bytes() for name in ('report.html', 'room.js', 'playback.js', 'evidence.js'))"
              subprocess.run([str(python), '-c', assets], cwd=root, check=True)
