name: Hosted audits

on:
  push:
    paths: ['web/**', '.github/workflows/web.yml']
  pull_request:
    paths: ['web/**', '.github/workflows/web.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade "pip>=26.2,<27"
          python -m pip install -e . -r web/requirements.txt "pytest>=8,<10" "httpx>=0.27,<1"
          python -m playwright install --with-deps chromium
      - name: Test
        working-directory: web
        run: python -m pytest -q
      - name: Check shell scripts
        run: sh -n web/sandbox/run-audit.sh && sh -n web/sandbox/setup.sh
