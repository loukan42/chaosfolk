# Keeps the SHA-pinned GitHub Actions current and opens Python security updates as soon as an
# advisory matches. Routine Python version updates are switched off (open-pull-requests-limit: 0):
# requirements-dev.txt is generated by uv from pyproject.toml and Dependabot reads it as a flat list
# of pins, so it proposes transitive bumps that break the constraints of their parents (pyee 16 against
# playwright's pyee<15, pull request #27). The lock is refreshed with the uv command recorded at the top
# of requirements-dev.txt (see CONTRIBUTING.md); pip-audit runs weekly against the lock.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0
    # Security updates ignore the cooldown and open at once; it applies to version updates only.
    cooldown:
      default-days: 7
    labels: [dependencies, security]
    commit-message:
      prefix: "deps"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    # A new action release waits a week before Dependabot proposes it, so a compromised tag that is
    # pulled within days never reaches CI.
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
    labels: [dependencies]
    commit-message:
      prefix: "ci"
