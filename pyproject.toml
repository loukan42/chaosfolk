[build-system]
requires = ["setuptools>=84.1,<86"]
build-backend = "setuptools.build_meta"

[project]
name = "chaosfolk"
version = "0.8.0"
description = "Let simulated users explore your web app. Replay the failures with evidence."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Lou Husson"}]
dependencies = ["playwright>=1.63,<2", "psutil>=6,<8"]
keywords = ["qa", "testing", "playwright", "ai-agents", "exploratory-testing"]
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3", "Topic :: Software Development :: Testing"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "build>=1,<2", "ruff>=0.11,<1", "bandit[toml,sarif]>=1.8,<2", "pip-audit>=2,<3", "pre-commit>=4,<5"]
visual = ["Pillow>=10,<14"]
pdf = ["pypdf>=5,<7"]
chaos = ["tzdata>=2025.2"]

[project.scripts]
chaosfolk = "chaosfolk.cli:main"

[project.urls]
Homepage = "https://github.com/loukan42/chaosfolk"
Issues = "https://github.com/loukan42/chaosfolk/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
chaosfolk = ["*.js", "*.json", "templates/*", "demo/*", "bench_apps/*", "bench_apps/*/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["browser: launches a real Chromium browser"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E9", "F"]

[tool.bandit]
# Static security scan of the package (python -m bandit -c pyproject.toml -r src). Tests are synthetic fixtures.
exclude_dirs = ["tests", ".venv", "build", "dist"]
# B608: SQL text is assembled only from constant table names and "?" placeholders checked in evidence.py and
# reporting.py; every value is bound as a parameter. Remaining accepted risks carry an inline "nosec" with a reason.
skips = ["B608"]
