function profileText(person){const source=person.name||person.profil||person.profil_id||'',entry=catalog.find(p=>p.skin===person.skin),translated=person.translations?.[lang]||entry?.translations?.[lang];if(translated)return {name:translated.name||source,habit:array(translated.habits)[0]||''};if(lang==='fr'&&profileFrench[source])return {name:profileFrench[source][0],habit:profileFrench[source][1]};return {name:source,habit:array(person.habits||person.habitudes)[0]||'',original:lang==='fr'};}
function avatar(skin,small=false){const el=node('span',undefined,'avatar'+(small?' small-avatar':'')),path=localImage(data?.branding?.skins);el.setAttribute('aria-hidden','true');const columns=Number(data?.branding?.columns||data?.branding?.grid?.columns)||4,rows=Number(data?.branding?.rows||data?.branding?.grid?.rows)||Math.max(1,Math.ceil(catalog.length/columns));skin=Number.isInteger(skin)&&skin>=0&&skin<columns*rows?skin:0;if(path){el.style.backgroundImage=`url("${path.replaceAll('"','%22')}")`;el.style.backgroundSize=`${columns*100}% ${rows*100}%`;el.style.backgroundPosition=`${columns>1?skin%columns*100/(columns-1):0}% ${rows>1?Math.floor(skin/columns)*100/(rows-1):0}%`;}return el;}
function overlayFor(f){const translations=data?.constats?.translations?.[lang],collection=translations?.constats;const candidate=Array.isArray(collection)?collection.find(x=>x?.id===f.id):collection?.[f.id];if(!candidate||typeof candidate!=='object')return {...f,_original:lang!==baseLanguage};const result={...f,_original:false};for(const key of ['titre','resume','condition','suite'])if(typeof candidate[key]==='string')result[key]=candidate[key];if(candidate.correctif&&typeof candidate.correctif==='object'){result.correctif={...f.correctif};for(const key of ['consigne','attendu','ou'])if(typeof candidate.correctif[key]==='string')result.correctif[key]=candidate.correctif[key];}return result;}

let filter='all',selected=events,index=0,timer=null;
const selectedFindings=new Set(findings.map(f=>f.id)),openFindings=new Set();
function buildPrompt(){const chosen=findings.filter(f=>selectedFindings.has(f.id)).map(overlayFor);return chosen.map(f=>[f.id+' · '+f.titre,f.correctif?.consigne||f.resume,f.correctif?.attendu?t('expected')+': '+f.correctif.attendu:''].filter(Boolean).join('\n')).join('\n\n');}
function updateBulk(){const n=findings.filter(f=>selectedFindings.has(f.id)).length;$('#copy-selected').textContent=lang==='fr'?`Copier ${n===1?'le':'les'} ${n} coché${n===1?'':'s'}`:`Copy ${n} selected`;$('#copy-selected').disabled=n===0;$('#view-prompt').disabled=n===0;$('#prompt-text').value=buildPrompt();}
function renderFindings(){const host=$('#findings');host.replaceChildren();const subset=findings.filter(f=>filter==='all'||(filter==='proven'?proven(f):!proven(f)));if(!subset.length){host.append(node('div',t(findings.length?'noMatch':'noFindings'),'empty'));updateBulk();return;}
 for(const original of subset){const f=overlayFor(original),card=node('article',undefined,'finding'),row=node('div',undefined,'finding-row'),check=node('input'),toggle=node('button',undefined,'finding-toggle'),body=node('div',undefined,'finding-body');check.type='checkbox';check.checked=selectedFindings.has(f.id);check.setAttribute('aria-label',(lang==='fr'?'Sélectionner ':'Select ')+(f.id||f.titre));check.addEventListener('change',()=>{check.checked?selectedFindings.add(f.id):selectedFindings.delete(f.id);updateBulk();});toggle.setAttribute('aria-expanded',String(openFindings.has(f.id)));body.hidden=!openFindings.has(f.id);toggle.append(node('span',severityLabel(f.gravite),'severity warn'),node('span',f.id||t('observation'),'finding-id'),node('strong',f.titre||t('untitled')),node('span',t(proven(original)?'proven':'needsEvidence'),'finding-status '+(proven(original)?'good':'muted')),node('span',body.hidden?'⌄':'⌃','chevron'));toggle.addEventListener('click',()=>{body.hidden=!body.hidden;toggle.setAttribute('aria-expanded',String(!body.hidden));toggle.querySelector('.chevron').textContent=body.hidden?'⌄':'⌃';body.hidden?openFindings.delete(f.id):openFindings.add(f.id);});row.append(check,toggle);card.append(row);body.append(node('p',f.resume||'','muted'));if(f._original)body.append(node('p',t('source'),'source-note'));if(f.condition)body.append(node('p',t('condition')+': '+f.condition,'small'));
 const proofs=node('div',undefined,'proofs');for(const [key,p] of Object.entries(original.preuves||{})){const proof=node('div',undefined,'proof');proof.append(node('strong',proofLabel(key)),node('span',valid(p)?`${p.casses}/${p.fois} ${t('failures')}`:t('incomplete'),valid(p)&&p.casses===0?'good':'warn'));proofs.append(proof);}body.append(proofs);
 if(f.correctif){const fix=node('div',undefined,'fix');fix.append(node('div',t('recommended'),'fix-label'),node('p',f.correctif.consigne||t('review')));if(f.correctif.attendu)fix.append(node('p',t('expected')+': '+f.correctif.attendu,'small muted'));const copy=node('button',t('copy'));copy.addEventListener('click',async()=>{const text=[f.titre,f.correctif.consigne,f.correctif.attendu].filter(Boolean).join('\n');try{await navigator.clipboard.writeText(text);copy.textContent=t('copied');}catch{copy.textContent=t('copyFallback');$('#prompt-panel').hidden=false;$('#prompt-text').value=text;$('#prompt-text').focus();$('#prompt-text').select();}});fix.append(copy);body.append(fix);}
 const details=node('details');details.append(node('summary',t('inspect')));for(const [key,p] of Object.entries(original.preuves||{})){if(!p||typeof p!=='object')continue;for(const [number,path] of array(p.captures).entries()){if(!path)continue;details.append(node('p',`${proofLabel(key)} · ${t('trial')} ${number+1}`,'mono muted'));const img=picture(path,`${f.id}: ${proofLabel(key)}, ${t('trial')} ${number+1}`);img.className='proof-image';details.append(img);}}body.append(details);card.append(body);host.append(card);}updateBulk();
}
function renderScore(){const score=data?.score,hasScore=Number.isFinite(score?.note),host=$('#score-value');host.replaceChildren();if(!hasScore){host.append(node('span',lang==='fr'?'En attente':'Pending','score-pending'));}else{const level={fragile:['Fragile','Fragile'],unstable:['Unstable','Instable'],fair:['Fair','Correcte'],solid:['Solid','Solide'],tested:['Tested','Testée']}[score.level]||['',''];host.append(node('span',score.note,'score-number'),node('span','/ 100','score-denominator'),node('span',level[lang==='fr'?1:0],'score-level'));}const cap=score?.cap;$('#score-cap').textContent=cap?.reason?((lang==='fr'?`Au plus ${cap.value} tant que `:`Capped at ${cap.value} while `)+(array(cap.ids).join(', ')||(lang==='fr'?'des points restent ouverts':'findings remain open'))+(lang==='fr'?' reste à traiter.':' remains unresolved.')):(lang==='fr'?'Indicateur de cette séance uniquement.':'Indicator for this session only.');if(score?.after_fix&&Number.isFinite(score.after_fix.note))$('#score-cap').textContent+=(lang==='fr'?` Après correction (projection) : ${score.after_fix.note}.`:` After fixes (projection): ${score.after_fix.note}.`);$('#score-method-label').textContent=lang==='fr'?'Comprendre cette note':'How this score is calculated';const detail=$('#score-detail');detail.replaceChildren();detail.append(node('p',lang==='fr'?'Cette note décrit les résultats de la séance, sans mesurer la fiabilité globale de l’application.':'This score describes the session results, not the app’s overall reliability.'));if(score?.provisional)detail.append(node('p',lang==='fr'?'Note provisoire : preuves ou couverture à compléter.':'Provisional score: evidence or coverage is incomplete.'));for(const pillar of array(score?.pillars)){const row=node('div',undefined,'score-detail-row');row.append(node('span',pillar.label?.[lang]||pillar.name?.[lang]||({defects:lang==='fr'?'Défauts':'Defects',properties:lang==='fr'?'Propriétés':'Properties',faults:lang==='fr'?'Pannes':'Faults',journeys:lang==='fr'?'Parcours':'Journeys'})[pillar.id]||pillar.id),node('span',`${pillar.value} / ${pillar.max}`));detail.append(row);}if(cap?.reason)detail.append(node('p',(lang==='fr'?'Motif du plafond : ':'Cap reason: ')+(cap.reason?.[lang]||({'proven-blocker':lang==='fr'?'défaut bloquant reproduit':'reproduced blocking defect','open-blocker':lang==='fr'?'défaut bloquant à vérifier':'blocking defect awaiting verification','proven-annoying':lang==='fr'?'défaut gênant reproduit':'reproduced usability defect'})[cap.reason]||cap.reason)));$('#title').textContent=lang==='fr'?`${findings.length} point${findings.length===1?'':'s'} à vérifier`:`${findings.length} point${findings.length===1?'':'s'} to review`;}
function selectPerson(id,scroll=false){stop();$('#person').value=id;selected=events.filter(e=>id==='all'||e.h===id);index=0;renderEvent();document.querySelectorAll('.screen-card').forEach(el=>el.setAttribute('aria-pressed',String(el.dataset.person===id)));if(scroll){$('#session-title').scrollIntoView({block:'start'});$('#person').focus({preventScroll:true});}}
function renderMosaic(){const host=$('#mosaic');host.replaceChildren();if(!ids.length){host.append(node('div',t('noActions'),'empty'));return;}for(const id of ids){const person=peopleById.get(id),trace=events.filter(e=>e.h===id),last=[...trace].reverse().find(e=>localImage(e.capture)),card=node('button',undefined,'screen-card'),preview=node('div',undefined,'mini-screen'),heading=node('div',undefined,'screen-person'),name=person?.nom||id;card.dataset.person=id;card.setAttribute('aria-pressed',String($('#person').value===id));card.setAttribute('aria-label',t('openReplay')+' '+name);preview.append(picture(last?.capture,t('lastScreen')+': '+name),node('span',t('lastScreen'),'snapshot-label'));if(person)heading.append(avatar(person.skin,true));const text=node('div');text.append(node('strong',name),node('small',person?profileText(person).name:t('series')),node('small',trace.length+' '+t('events')));heading.append(text);card.append(preview,heading);card.addEventListener('click',()=>selectPerson(id,true));host.append(card);}}
function renderCast(){const host=$('#cast');host.replaceChildren();$('#cast-section').hidden=!catalog.length;$('#cast-note').textContent=t(data?.config?.demo?'profileNote':'profileNoteReal');for(const person of catalog){const text=profileText(person),el=node('div',undefined,'cast-card');el.append(avatar(person.skin),node('strong',text.name||t('profileExample')),node('small',text.habit));if(text.original)el.title=t('unknownProfile');host.append(el);}}
function stop(){clearInterval(timer);timer=null;$('#play').textContent=t('play');}
function renderEvent(){const e=selected[index];$('#timeline').max=Math.max(0,selected.length-1);$('#timeline').value=index;$('#event-count').textContent=`${selected.length} ${t('events')}`;$('#screen').replaceChildren();$('#narrative').replaceChildren();$('#prev').disabled=!e||index===0;$('#next').disabled=!e||index===selected.length-1;$('#play').disabled=selected.length<2;$('#timeline').disabled=selected.length<2;if(!e){$('#screen').append(node('p',t('noActions'),'muted'));return;}$('#screen').append(picture(e.capture,`${t('screenFor')} ${e.h}, ${t('action')} ${e.n}`));const out=$('#narrative'),person=peopleById.get(e.h);if(person){const heading=node('div',undefined,'person-heading');heading.append(avatar(person.skin,true),node('strong',person.nom||person.id));out.append(heading);}out.append(node('div',`${e.h} / ${e.n}`,'eyebrow'),node('h3',lang==='fr'?({replay:'Rejeu',click:'Clic',type:'Saisie',look:'Observation',reload:'Rechargement',key:'Clavier',select:'Sélection',scroll:'Défilement',done:'Terminé',giveup:'Abandon',flag:'Signalement'})[e.action]||e.action||t('action'):e.action||t('action')),node('span',t(e.resultat==='ok'?'completed':'failed'),'pill '+(e.resultat==='ok'?'good':'bad')));if(e.cible_nom)out.append(node('p',e.cible_nom));if(e.message){out.append(node('p',t('originalDiagnostic'),'mono muted'),node('p',e.message,'small muted'));}if(e.dit||e.pense){out.append(node('p',t('originalReaction'),'mono muted'),node('p',e.dit||e.pense,'reaction'));}if(e.humeur)out.append(node('p',e.humeur,'small muted'));out.append(node('p',`${t('event')} ${index+1} ${t('of')} ${selected.length}`,'small muted'));}
function renderLanguage(){stop();document.documentElement.lang=lang;document.title='Chaosfolk · '+t('title');const labels={'skip':'skip','header-caption':'header','findings-title':'findings','overview-title':'overview','screens-title':'screens','screens-hint':'screensHint','session-title':'session','person-label':'person','timeline-label':'timeline','cast-title':'profileLibrary','footer-label':'footer'};for(const [id,key] of Object.entries(labels))$('#'+id).textContent=t(key);$('.lang-switch').setAttribute('aria-label',t('language'));$('#filters').setAttribute('aria-label',t('filter'));$('#prev').setAttribute('aria-label',t('prev'));$('#next').setAttribute('aria-label',t('next'));$('#label').textContent=t(data?.config?.demo?'demo':'exploration');$('#notice').textContent=t(data?.config?.demo?'demoNotice':'notice');$('#generated').textContent=data?.genere?t('generated')+' '+String(data.genere).replace('T',' '):'';

 $('#metrics').replaceChildren();const trials=findings.reduce((n,f)=>n+Object.values(f.preuves||{}).reduce((a,p)=>a+(Number.isInteger(p?.fois)?p.fois:0),0),0);for(const [value,key] of [[people.length,'users'],[events.length,data?.config?.demo?'trials':'actions'],[findings.filter(proven).length,'reproduced'],[trials,'evidence']]){const el=node('div',undefined,'metric');el.append(node('strong',value),node('span',t(key)));$('#metrics').append(el);}renderFindings();renderMosaic();renderCast();renderEvent();renderScore();$('#findings-title').textContent=lang==='fr'?'À corriger':'To fix';$('#selected-hint').textContent=lang==='fr'?'Cochés : envoyés dans le prompt':'Selected findings are included in the prompt';$('#review-session').textContent=lang==='fr'?'Revoir la séance':'Review the session';$('#view-prompt').textContent=lang==='fr'?'Voir le prompt':'View prompt';$('#prompt-label').textContent=lang==='fr'?'Prompt de correction sélectionnable':'Selectable fix prompt';$('#copy-status').textContent='';}
$('#review-session').addEventListener('click',()=>{$('#session-title').scrollIntoView({block:'start'});$('#person').focus({preventScroll:true});});$('#view-prompt').addEventListener('click',()=>{$('#prompt-panel').hidden=!$('#prompt-panel').hidden;updateBulk();});$('#copy-selected').addEventListener('click',async()=>{const text=buildPrompt();try{await navigator.clipboard.writeText(text);$('#copy-status').textContent=t('copied');}catch{$('#prompt-panel').hidden=false;$('#prompt-text').value=text;$('#prompt-text').focus();$('#prompt-text').select();$('#copy-status').textContent=t('copyFallback');}});
