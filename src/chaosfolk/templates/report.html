'use strict';
const data=/*__DONNEES__*/null;
const evidenceStore=window.createEvidenceStore?window.createEvidenceStore(data?.journal_details):{peek:e=>data?.journal_details&&Number.isSafeInteger(e?._detail)?undefined:e,event:()=>Promise.reject(new Error('missing-evidence')),proof:()=>Promise.reject(new Error('missing-evidence'))};
const $=s=>document.querySelector(s),array=v=>Array.isArray(v)?v:[];
function node(tag,text,cls){const el=document.createElement(tag);if(text!==undefined)el.textContent=String(text??'');if(cls)el.className=cls;return el;}

function stop(){clearInterval(timer);timer=null;$('#play').textContent=t('play');}

function renderEventNarrative(e){const out=$('#narrative'),person=peopleById.get(e.h);out.replaceChildren();if(person){const heading=node('div',undefined,'person-heading');heading.append(avatar(person.skin,true),node('strong',person.nom||person.id));out.append(heading);}out.append(node('div',`${seriesName(e.h)} / ${e.n}`,'eyebrow'),node('h3',lang==='fr'?({replay:'Rejeu',click:'Clic',type:'Saisie',look:'Observation',reload:'Rechargement',key:'Clavier',select:'Sélection',scroll:'Défilement',done:'Terminé',giveup:'Abandon',flag:'Signalement'})[e.action]||e.action||t('action'):e.action||t('action')),node('span',t(e.resultat==='ok'?'completed':'failed'),'pill '+(e.resultat==='ok'?'good':'bad')));if(e.cible_nom)out.append(node('p',e.cible_nom));if(e.message){out.append(node('p',t('originalDiagnostic'),'mono muted'),node('p',e.message,'small muted'));}if(e.dit||e.pense){out.append(node('p',t('originalReaction'),'mono muted'),node('p',e.dit||e.pense,'reaction'));}if(e.humeur)out.append(node('p',e.humeur,'small muted'));out.append(node('p',`${t('event')} ${index+1} ${t('of')} ${selected.length}`,'small muted'));}
function renderEvent(){const e=selected[index],turn=++eventVersion;$('#timeline').max=Math.max(0,selected.length-1);$('#timeline').value=index;$('#event-count').textContent=`${selected.length} ${t('events')}`;$('#screen').replaceChildren();$('#narrative').replaceChildren();$('#prev').disabled=!e||index===0;$('#next').disabled=!e||index===selected.length-1;$('#play').disabled=selected.length<2;$('#timeline').disabled=selected.length<2;if(!e){$('#screen').append(node('p',t('noActions'),'muted'));return;}$('#screen').append(picture(e.capture,`${t('screenFor')} ${e.h}, ${t('action')} ${e.n}`));const loaded=evidenceStore.peek(e);renderEventNarrative(loaded||e);if(loaded||!$('#detail-player').open)return;const current=()=>eventVersion===turn&&$('#detail-player').open;const status=node('div',lang==='fr'?'Chargement des détails…':'Loading details…','small muted');$('#narrative').append(status);const load=()=>evidenceStore.event(e,current).then(value=>{if(current())renderEventNarrative(value);}).catch(()=>{if(current())evidenceError(status,load);});load();}

 renderFindings();renderMatrices();renderCoverage();renderMosaic();renderEvent();renderScore();$('#findings-title').textContent=lang==='fr'?'Constats et pistes à vérifier':'Findings and points to review';$('#review-session').textContent=lang==='fr'?'Revoir la séance':'Review the session';$('#detail-summary').textContent=lang==='fr'?'Détail d’un parcours':'Individual journey';$('#session-title').textContent=lang==='fr'?'Détail du parcours':'Individual journey';$('#view-prompt').textContent=lang==='fr'?'Voir le prompt':'View prompt';$('#prompt-label').textContent=lang==='fr'?'Prompt des constats sélectionnés':'Selected findings prompt';$('#copy-status').textContent='';}
