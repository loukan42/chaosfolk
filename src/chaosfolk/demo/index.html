<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fieldnotes · Chaosfolk demo</title>
<style>
:root{color-scheme:light;font:16px/1.6 system-ui,sans-serif;color:#172124;background:#edf0ea}
*{box-sizing:border-box}body{margin:0}main{max-width:720px;margin:9vh auto;padding:32px}
header{display:flex;justify-content:space-between;align-items:center;gap:16px;border-bottom:1px solid #b9c3b6;padding-bottom:24px}
.brand{font-weight:750;letter-spacing:-.04em;font-size:24px}.tag{font:12px monospace;text-transform:uppercase}
h1{font-size:clamp(36px,7vw,58px);line-height:1.1;letter-spacing:-.05em;margin:48px 0 16px}
p{color:#49574b}form{background:#fff;border:1px solid #c6d0c4;padding:28px;margin-top:32px;border-radius:16px}
label{display:block;font-weight:650;margin-bottom:8px}input{font:inherit;width:100%;padding:12px;border:1px solid #7f8d80;border-radius:6px}
button{font:600 16px system-ui;padding:14px 22px;background:#203c2c;color:white;border:0;border-radius:6px;margin-top:16px;cursor:pointer}
:focus-visible{outline:3px solid #9e4a0d;outline-offset:3px}#status{min-height:26px;color:#7b310b}li{padding:12px;border-bottom:1px solid #c6d0c4}
footer{margin-top:40px;font:13px/1.6 monospace;color:#53604e}
</style><main><header><span class="brand">fieldnotes.</span><span class="tag">Local test fixture</span></header>
<h1>Make room for<br>your next idea.</h1><p>A tiny project list with a deliberate storage bug. Chaosfolk tests what happens when saving fails.</p>
<form id="form"><label for="name">Project name</label><input id="name" name="name" autocomplete="off" required><button>Save project</button><p id="status" role="status" aria-live="polite"></p></form>
<h2>Your projects</h2><ul id="projects"></ul><footer>CHAOSFOLK / DEMONSTRATION APP<br>Synthetic data. Runs on your computer.</footer></main>
<script>
const field=document.querySelector('#name'), statusLine=document.querySelector('#status'), list=document.querySelector('#projects');
const fixed=new URLSearchParams(location.search).has('fixed');
function save(name){localStorage.setItem('fieldnotes.project',name);const li=document.createElement('li');li.textContent=name;list.append(li);statusLine.textContent='Project saved';}
document.querySelector('#form').addEventListener('submit',event=>{
 event.preventDefault();const name=field.value;
 if(fixed){try{save(name);field.value='';}catch{statusLine.textContent='Could not save. Your draft is still here.';}}
 else{field.value='';save(name);}
});
</script></html>
